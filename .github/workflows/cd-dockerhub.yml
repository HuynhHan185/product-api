name: CD Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  MONGO_IMAGE: mongo:7.0

jobs:
  test:
    name: CI - Test CRUD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/productdb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  healthcheck:
    name: CI - Healthcheck bằng Docker Compose
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dựng hệ thống
        run: docker compose up -d --build
      - name: Chờ MongoDB và API cùng healthy
        run: |
          for i in $(seq 1 30); do
            mongo=$(docker inspect --format '{{.State.Health.Status}}' nammongodb)
            api=$(docker inspect --format '{{.State.Health.Status}}' product-api)
            echo "mongodb=$mongo api=$api"
            if [ "$mongo" = "healthy" ] && [ "$api" = "healthy" ]; then
              curl -fsS http://localhost:3000/health
              echo ""
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Dọn dẹp
        if: always()
        run: docker compose down -v

  push:
    name: CD - Đẩy image lên Docker Hub
    runs-on: ubuntu-latest
    needs: [test, healthcheck]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
